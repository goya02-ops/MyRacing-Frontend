name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy frontend
    runs-on: ubuntu-latest
    # Producción la publica Vercel automáticamente al mergear a main
    # (integración Git). Como el merge a main exige tests + Coverage ≥80% +
    # Quality Gate del proyecto, todo lo que llega a main ya está verde.
    # Este workflow solo audita post-merge: re-verifica el Quality Gate.
    if: github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - name: SonarCloud Quality Gate (auditoría post-merge)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Falta el secret SONAR_TOKEN: no se puede auditar el Quality Gate."
            exit 1
          fi
          status=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=goya02-ops_MyRacing-Frontend" | jq -r '.projectStatus.status')
          echo "Quality Gate del proyecto: $status"
          if [ "$status" != "OK" ]; then
            echo "ALERTA: se mergeó a main con el Quality Gate en $status. Revisar."
            exit 1
          fi
          echo "OK: main publicado por Vercel con Quality Gate en verde."
