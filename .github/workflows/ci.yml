name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build production
        run: pnpm build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test --if-present

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          include-hidden-files: true
          if-no-files-found: ignore

  e2e:
    name: E2E (full stack)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password_segura
          MYSQL_DATABASE: myracing
          MYSQL_USER: admin
          MYSQL_PASSWORD: MiR@cing_2025!
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u admin -pMiR@cing_2025!"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: myracing
      DB_USER: admin
      DB_PASSWORD: MiR@cing_2025!
      JWT_SECRET: ci_secret_for_tests
      JWT_REFRESH_SECRET: ci_refresh_secret_for_tests
      URL_FRONTEND: http://localhost:5173
      URL_BACKEND: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Checkout backend (real API)
        uses: actions/checkout@v4
        with:
          repository: goya02-ops/MyRacing-Backend
          ref: main
          path: backend

      - name: Install backend deps
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Build backend
        working-directory: backend
        run: pnpm build

      - name: Start backend
        working-directory: backend
        run: |
          pnpm start &
          sleep 5
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: myracing
          DB_USER: admin
          DB_PASSWORD: MiR@cing_2025!
          JWT_SECRET: ci_secret_for_tests
          JWT_REFRESH_SECRET: ci_refresh_secret_for_tests

      - run: pnpm install --frozen-lockfile

      - name: Start frontend (Vite dev)
        run: |
          pnpm dev -- --host 127.0.0.1 &
          sleep 5
        env:
          VITE_API_BASE_URL: http://127.0.0.1:3000/api

      - name: Run E2E tests (Playwright, full stack)
        run: pnpm run test:e2e --if-present